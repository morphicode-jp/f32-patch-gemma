<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Cardinal Live Viewer — 3D</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #0a0a12;
    color: #e8e8f0;
    margin: 0;
    padding: 12px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .status-bar {
    background: #14141f;
    padding: 8px 12px;
    margin-bottom: 12px;
    border-radius: 4px;
    font-size: 12px;
    color: #a0a0b8;
    border-left: 3px solid #5a8cff;
  }
  .universes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .universe {
    background: #14141f;
    border-radius: 6px;
    padding: 10px;
    border: 1px solid #26263a;
  }
  .universe.best { border-color: #fbbf24; box-shadow: 0 0 16px rgba(251, 191, 36, 0.12); }
  .universe.worst { opacity: 0.55; border-color: #7f1d1d; }
  .universe-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .universe-id { font-weight: 600; font-size: 13px; }
  .universe-id .best-tag {
    font-size: 10px; color: #fbbf24; margin-left: 6px;
  }
  .quality { font-variant-numeric: tabular-nums; font-size: 18px; color: #5a8cff; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 2px 10px;
    font-size: 10.5px;
    color: #a0a0b8;
    margin-top: 6px;
  }
  .stat-row { display: flex; justify-content: space-between; gap: 4px; }
  .stat-val { color: #e8e8f0; font-variant-numeric: tabular-nums; }
  .world-3d {
    width: 100%;
    height: 220px;
    background: #05050a;
    border-radius: 4px;
    margin-top: 6px;
    display: block;
  }
  .hp-list {
    font-size: 10px;
    color: #808098;
    margin-top: 4px;
    font-family: "SF Mono", Consolas, monospace;
    line-height: 1.5;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 10px;
  }
  .hp-row { display: flex; justify-content: space-between; }
  .hp-key { color: #707090; }
  .hp-val { color: #a8b0e0; }
  #history-chart {
    background: #14141f;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  canvas#historyCanvas {
    width: 100%;
    height: 180px;
    display: block;
  }
  .legend {
    display: flex;
    gap: 12px;
    font-size: 11px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .section-title {
    font-size: 11px;
    color: #707090;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .axis-note {
    font-size: 10px; color: #606080; margin-top: 2px;
  }
</style>
</head>
<body>

<h1>Cardinal Live Viewer — 多世界メタ進化 (3D)</h1>
<div class="status-bar" id="status">Loading...</div>

<div id="history-chart">
  <div class="section-title">品質 (quality) の推移</div>
  <canvas id="historyCanvas"></canvas>
  <div class="legend" id="legend"></div>
</div>

<div class="section-title" style="margin-bottom:6px;">宇宙ごとの 3D 生態系</div>
<div class="universes" id="universes"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const UNIVERSE_COLORS = ["#5a8cff","#fbbf24","#34d399","#f87171","#a78bfa","#60a5fa","#fb923c"];
const colorFor = (id) => UNIVERSE_COLORS[id % UNIVERSE_COLORS.length];

const scenes = new Map();  // universe_id → { scene, camera, renderer, ... }
let historyByUniverse = {};

function fmtNum(v, d=2) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  if (Math.abs(v) >= 100) return v.toFixed(0);
  if (Math.abs(v) >= 10)  return v.toFixed(1);
  return v.toFixed(d);
}

function buildScene(canvas, worldSize) {
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(W, H, false);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05050a);
  scene.fog = new THREE.Fog(0x05050a, worldSize * 1.5, worldSize * 3.5);

  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 500);
  camera.position.set(worldSize * 1.2, worldSize * 1.6, worldSize * 1.2);
  camera.lookAt(worldSize / 2, 0, worldSize / 2);

  const controls = new OrbitControls(camera, canvas);
  controls.target.set(worldSize / 2, 0, worldSize / 2);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;

  // Ground grid
  const gridHelper = new THREE.GridHelper(worldSize, worldSize, 0x26263a, 0x1c1c2a);
  gridHelper.position.set(worldSize / 2, 0, worldSize / 2);
  scene.add(gridHelper);

  // Floor plane (subtle)
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(worldSize, worldSize),
    new THREE.MeshBasicMaterial({ color: 0x0f0f18, side: THREE.DoubleSide })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(worldSize / 2, -0.01, worldSize / 2);
  scene.add(floor);

  // Lights
  const hemi = new THREE.HemisphereLight(0xaaaaff, 0x222222, 0.5);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(worldSize, worldSize * 2, worldSize);
  scene.add(dir);

  const agentsGroup = new THREE.Group(); scene.add(agentsGroup);
  const foodGroup = new THREE.Group(); scene.add(foodGroup);

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w === 0 || h === 0) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  return { scene, camera, renderer, controls, agentsGroup, foodGroup, resize };
}

function updateScene(ctx, u) {
  const { agentsGroup, foodGroup } = ctx;
  // Clear
  while (agentsGroup.children.length) agentsGroup.remove(agentsGroup.children[0]);
  while (foodGroup.children.length) foodGroup.remove(foodGroup.children[0]);

  const is3D = !!u.is_3d;

  // Food as small cubes — z from real position if 3D
  const foodGeom = new THREE.BoxGeometry(0.5, 0.35, 0.5);
  const foodMatGround = new THREE.MeshStandardMaterial({ color: 0x2ddd66, emissive: 0x114422 });
  const foodMatCanopy = new THREE.MeshStandardMaterial({ color: 0xffb84d, emissive: 0x553311 });
  for (const f of (u.food || [])) {
    const fz = is3D ? (f.z || 0.5) : 0.15;
    const mat = (is3D && fz > 1.0) ? foodMatCanopy : foodMatGround;
    const m = new THREE.Mesh(foodGeom, mat);
    m.position.set(f.x, fz, f.y);
    foodGroup.add(m);
  }

  // Agents as spheres — z from real position if 3D, else energy-based
  const agentGeom = new THREE.SphereGeometry(0.4, 12, 12);
  for (const a of (u.positions || [])) {
    const gen = a.g || 0;
    const hue = (210 + gen * 40) % 360;
    const color = new THREE.Color(`hsl(${hue}, 70%, 60%)`);
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: color.clone().multiplyScalar(0.3), roughness: 0.4
    });
    const radius = 0.3 + Math.min(a.e / 50, 0.5);
    const mesh = new THREE.Mesh(agentGeom, mat);
    mesh.scale.setScalar(radius / 0.4);
    // Elevation: real z (3D mode) or energy-based (legacy)
    const z = is3D ? (a.z || 0.5) : Math.max(0.3, (a.e || 0) / 15);
    mesh.position.set(a.x, z, a.y);
    agentsGroup.add(mesh);

    // Shadow line down to floor
    const lineGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.x, z, a.y),
      new THREE.Vector3(a.x, 0.01, a.y),
    ]);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x333344 });
    agentsGroup.add(new THREE.Line(lineGeom, lineMat));
  }
}

function animateAll() {
  for (const [, ctx] of scenes) {
    ctx.resize();
    ctx.controls.update();
    ctx.renderer.render(ctx.scene, ctx.camera);
  }
  requestAnimationFrame(animateAll);
}

function renderUniverse(u, bestId, worstId) {
  const el = document.createElement("div");
  el.className = "universe"
    + (u.id === bestId ? " best" : "")
    + (u.id === worstId ? " worst" : "");

  const header = document.createElement("div");
  header.className = "universe-header";
  const idSpan = document.createElement("div");
  idSpan.className = "universe-id";
  idSpan.style.color = colorFor(u.id);
  idSpan.innerHTML = `Universe #${u.id}`
    + (u.id === bestId ? ' <span class="best-tag">★ WINNER</span>' : "");
  header.appendChild(idSpan);
  const qSpan = document.createElement("div");
  qSpan.className = "quality";
  qSpan.textContent = fmtNum(u.quality, 2);
  header.appendChild(qSpan);
  el.appendChild(header);

  const canvas = document.createElement("canvas");
  canvas.className = "world-3d";
  canvas.dataset.uid = u.id;
  el.appendChild(canvas);

  const axisNote = document.createElement("div");
  axisNote.className = "axis-note";
  const axisText = u.is_3d
    ? "★ 本物 3D: agent 高さ = 実 z 座標 (跳躍/重力)、樹上食料は 橙 / ドラッグで視点回転"
    : "2D 平面 (疑似 3D): 高さ = エネルギー、色 = 世代 / ドラッグで視点回転";
  axisNote.textContent = axisText;
  el.appendChild(axisNote);

  const grid = document.createElement("div");
  grid.className = "stats-grid";
  const st = u.stats;
  const pairs = u.is_3d ? [
    ["alive", st.n_alive], ["births", st.n_births],
    ["deaths", st.n_deaths], ["gen", st.max_generation],
    ["DNA", fmtNum(st.dna_diversity, 3)], ["E", fmtNum(st.mean_energy, 1)],
    ["mean z", fmtNum(u.mean_agent_z, 2)], ["max z", fmtNum(u.max_agent_z, 2)],
  ] : [
    ["alive", st.n_alive], ["births", st.n_births],
    ["deaths", st.n_deaths], ["gen", st.max_generation],
    ["DNA", fmtNum(st.dna_diversity, 3)], ["E", fmtNum(st.mean_energy, 1)],
    ["food", st.n_food_voxels], ["light", fmtNum(st.light_level, 2)],
  ];
  for (const [k, v] of pairs) {
    const row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML = `<span>${k}</span><span class="stat-val">${v}</span>`;
    grid.appendChild(row);
  }
  el.appendChild(grid);

  const hpDiv = document.createElement("div");
  hpDiv.className = "hp-list";
  const wp = u.world_params;
  const keys = u.is_3d
    ? ["gravity", "jump_impulse", "max_height", "vertical_food_frac",
        "mutation_rate", "n_food"]
    : ["mutation_rate", "energy_decay_per_step", "food_energy_gain",
        "repro_energy_threshold", "max_population", "n_food"];
  for (const k of keys) {
    if (wp[k] === undefined) continue;
    const row = document.createElement("div");
    row.className = "hp-row";
    row.innerHTML = `<span class="hp-key">${k.replace(/_/g, ' ')}</span>`
                  + `<span class="hp-val">${fmtNum(wp[k], 3)}</span>`;
    hpDiv.appendChild(row);
  }
  el.appendChild(hpDiv);

  return el;
}

function drawHistory(canvas, universes) {
  const ctx = canvas.getContext("2d");
  const W = canvas.clientWidth * devicePixelRatio;
  const H = canvas.clientHeight * devicePixelRatio;
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W; canvas.height = H;
  }
  ctx.clearRect(0, 0, W, H);

  for (const u of universes) {
    if (!historyByUniverse[u.id]) historyByUniverse[u.id] = [];
    const arr = historyByUniverse[u.id];
    const last = arr[arr.length - 1];
    if (!last || Math.abs(last.q - u.quality) > 1e-9 || arr.length < 2) {
      arr.push({ t: historyByUniverse._t || 0, q: u.quality });
      if (arr.length > 200) arr.shift();
    }
  }
  historyByUniverse._t = (historyByUniverse._t || 0) + 1;

  const allQ = Object.keys(historyByUniverse)
    .filter(k => !k.startsWith("_"))
    .flatMap(k => historyByUniverse[k].map(s => s.q));
  if (allQ.length === 0) return;
  const qMin = Math.min(...allQ, 0);
  const qMax = Math.max(...allQ, 1);
  const qRange = qMax - qMin || 1;
  const tMax = historyByUniverse._t;

  ctx.strokeStyle = "#26263a"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(40, 10); ctx.lineTo(40, H - 30);
  ctx.lineTo(W - 10, H - 30);
  ctx.stroke();
  ctx.fillStyle = "#707090";
  ctx.font = `${11 * devicePixelRatio}px system-ui, sans-serif`;
  ctx.textAlign = "right";
  for (let i = 0; i <= 4; i++) {
    const q = qMin + (qRange * i / 4);
    const y = H - 30 - (H - 40) * (i / 4);
    ctx.fillText(fmtNum(q, 1), 36, y + 4);
    ctx.strokeStyle = "#1c1c2a";
    ctx.beginPath();
    ctx.moveTo(40, y); ctx.lineTo(W - 10, y);
    ctx.stroke();
  }
  ctx.textAlign = "start";

  for (const u of universes) {
    const arr = historyByUniverse[u.id] || [];
    if (arr.length < 2) continue;
    ctx.strokeStyle = colorFor(u.id);
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath();
    arr.forEach((s, i) => {
      const x = 40 + (W - 50) * (s.t / Math.max(tMax, 1));
      const y = H - 30 - (H - 40) * ((s.q - qMin) / qRange);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const last = arr[arr.length - 1];
    const x = 40 + (W - 50) * (last.t / Math.max(tMax, 1));
    const y = H - 30 - (H - 40) * ((last.q - qMin) / qRange);
    ctx.fillStyle = colorFor(u.id);
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
  }
}

function renderLegend(universes) {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const u of universes) {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<div class="legend-swatch" style="background:${colorFor(u.id)}"></div>
                      Universe #${u.id}`;
    legend.appendChild(item);
  }
}

async function poll() {
  try {
    const r = await fetch("/state.json", { cache: "no-store" });
    if (!r.ok) throw new Error("bad response");
    const state = await r.json();

    document.getElementById("status").textContent =
      `[${Math.floor(state.elapsed_s)}s] epoch ${state.epoch} step ${state.step} — ${state.status}`;

    const universes = state.universes || [];
    const bestId = state.best_id;
    let worstId = -1;
    if (universes.length > 0) {
      const sorted = [...universes].sort((a, b) => a.quality - b.quality);
      worstId = sorted[0].id;
    }

    // Build / update scene DOM
    const container = document.getElementById("universes");
    const existingIds = new Set(Array.from(container.children).map(
      el => parseInt(el.querySelector("canvas").dataset.uid)));
    const newIds = new Set(universes.map(u => u.id));

    // Rebuild if set changed
    if (existingIds.size !== newIds.size ||
        [...existingIds].some(id => !newIds.has(id))) {
      container.innerHTML = "";
      scenes.clear();
    }

    for (const u of universes) {
      let el = Array.from(container.children).find(
        e => parseInt(e.querySelector("canvas").dataset.uid) === u.id);
      if (!el) {
        el = renderUniverse(u, bestId, worstId);
        container.appendChild(el);
        const canvas = el.querySelector("canvas");
        // Wait a tick for layout
        requestAnimationFrame(() => {
          const ctx = buildScene(canvas, u.world_size || 14);
          scenes.set(u.id, ctx);
          updateScene(ctx, u);
        });
      } else {
        // Update class (best/worst might change)
        el.className = "universe"
          + (u.id === bestId ? " best" : "")
          + (u.id === worstId ? " worst" : "");
        // Update quality display
        el.querySelector(".quality").textContent = fmtNum(u.quality, 2);
        // Update winner tag
        const idSpan = el.querySelector(".universe-id");
        idSpan.innerHTML = `Universe #${u.id}`
          + (u.id === bestId ? ' <span class="best-tag">★ WINNER</span>' : "");
        idSpan.style.color = colorFor(u.id);
        // Update stats
        const pairs = [
          ["alive", u.stats.n_alive], ["births", u.stats.n_births],
          ["deaths", u.stats.n_deaths], ["gen", u.stats.max_generation],
          ["DNA", fmtNum(u.stats.dna_diversity, 3)],
          ["E", fmtNum(u.stats.mean_energy, 1)],
          ["food", u.stats.n_food_voxels],
          ["light", fmtNum(u.stats.light_level, 2)],
        ];
        const statRows = el.querySelectorAll(".stats-grid .stat-row");
        pairs.forEach(([k, v], i) => {
          if (statRows[i]) statRows[i].querySelector(".stat-val").textContent = v;
        });
        // Update scene
        const ctx = scenes.get(u.id);
        if (ctx) updateScene(ctx, u);
      }
    }

    drawHistory(document.getElementById("historyCanvas"), universes);
    renderLegend(universes);
  } catch (e) {
    document.getElementById("status").textContent = "connection error: " + e.message;
  }
}

animateAll();
setInterval(poll, 800);
poll();
</script>

</body>
</html>
